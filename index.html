<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Mi Escáner Escolar</title>
    <!-- Cargamos la versión estable de la librería -->
    <script src="https://unpkg.com"></script>
    <style>
        body {
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
            text-align: center;
            background-color: #f0f2f5;
            padding: 20px;
        }
        .container {
            max-width: 400px;
            margin: 0 auto;
            background: white;
            padding: 20px;
            border-radius: 15px;
            box-shadow: 0 4px 6px rgba(0,0,0,0.1);
        }
        h1 { color: #333; font-size: 24px; }
        #reader {
            width: 100%;
            border-radius: 10px;
            overflow: hidden;
            background: #e0e0e0;
            min-height: 250px;
        }
        #resultado {
            margin-top: 20px;
            padding: 15px;
            background-color: #e3f2fd;
            color: #0d47a1;
            border-radius: 10px;
            font-weight: bold;
            word-break: break-all;
        }
        /* Estilo para los botones nativos que creará la librería */
        button {
            background-color: #007bff !important;
            color: white !important;
            border: none !important;
            padding: 10px 20px !important;
            border-radius: 8px !important;
            font-size: 16px !important;
            margin: 10px 0 !important;
            cursor: pointer !important;
        }
        select {
            padding: 8px !important;
            border-radius: 5px !important;
            margin-bottom: 10px !important;
            width: 80% !important;
        }
    </style>
</head>
<body>

    <div class="container">
        <h1>📸 Escáner Escolar</h1>
        <p>Si la cámara no enciende sola, usa el botón de abajo</p>
        
        <!-- El contenedor donde se renderizará el escáner con controles manuales -->
        <div id="reader"></div>
        
        <div id="resultado">Esperando código...</div>
    </div>

    <script>
        function alEscanearExitoso(textoDecodificado) {
            document.getElementById('resultado').innerHTML = `
                <p style="color: green; margin: 0;">¡Código detectado! 🎉</p>
                <p style="margin: 5px 0 0 0;">${textoDecodificado}</p>
            `;
        }

        // Usamos el Scanner completo que incluye el menú de selección de cámara y botón de encendido manual
        let escanner = new Html5QrcodeScanner(
            "reader", 
            { 
                fps: 10, 
                qrbox: { width: 250, height: 250 },
                rememberLastUsedCamera: true,
                // Esto deshace el bug reciente de Chrome en Android
                useBarCodeDetectorIfSupported: false 
            }
        );
        
        escanner.render(alEscanearExitoso);
    </script>

</body>
</html>
