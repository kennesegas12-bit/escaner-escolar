<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Mi Escáner Escolar Nativo</title>
    <!-- Usamos un servidor alternativo global ultra-compatible -->
    <script src="https://jsdelivr.net"></script>
    <style>
        body {
            font-family: system-ui, -apple-system, sans-serif;
            text-align: center;
            background-color: #f0f2f5;
            padding: 20px;
            margin: 0;
        }
        .container {
            max-width: 400px;
            margin: 20px auto;
            background: white;
            padding: 25px;
            border-radius: 20px;
            box-shadow: 0 10px 25px rgba(0,0,0,0.05);
        }
        h1 { color: #1a1a1a; font-size: 26px; }
        p { color: #666; font-size: 14px; }
        
        /* Estilo genial para el botón del celular */
        .btn-escanear {
            background-color: #1a73e8;
            color: white;
            border: none;
            padding: 16px 20px;
            border-radius: 12px;
            font-size: 16px;
            font-weight: bold;
            width: 100%;
            cursor: pointer;
            box-shadow: 0 4px 6px rgba(26,115,232,0.2);
            transition: background 0.2s;
        }
        .btn-escanear:active { background-color: #1557b0; }
        
        #resultado {
            margin-top: 25px;
            padding: 15px;
            background-color: #e8f0fe;
            color: #1a73e8;
            border-radius: 12px;
            font-weight: bold;
            word-break: break-all;
            font-size: 16px;
        }
        /* Ocultamos el lector por defecto para evitar pantallas congeladas */
        #reader { display: none; }
    </style>
</head>
<body>

    <div class="container">
        <h1>📸 Escáner Escolar Pro</h1>
        <p>Toca el botón, toma una foto al código (QR o Barras) y la app lo leerá al instante.</p>
        
        <!-- Botón nativo que interactúa directamente con el sistema del teléfono -->
        <button class="btn-escanear" onclick="document.getElementById('input-archivo').click();">
            📷 Tomar Foto al Código
        </button>
        
        <!-- Input oculto que despierta la cámara del celular -->
        <input type="file" id="input-archivo" accept="image/*" capture="environment" style="display: none;">
        
        <div id="reader"></div>
        <div id="resultado">Esperando fotografía del código...</div>
    </div>

    <script>
        // Inicializamos el motor del escáner en modo archivo de fondo
        const html5QrCode = new Html5Qrcode("reader");
        const archivoInput = document.getElementById('input-archivo');

        archivoInput.addEventListener('change', e => {
            if (e.target.files.length == 0) {
                return;
            }

            const archivoImagen = e.target.files[0];
            document.getElementById('resultado').innerText = "Procesando la imagen... ⏳";

            // El motor analiza la foto tomada por el usuario
            html5QrCode.scanFile(archivoImagen, true)
                .then(textoDecodificado => {
                    document.getElementById('resultado').innerHTML = `
                        <div style="color: #0f5132; background-color: #d1e7dd; padding: 10px; border-radius: 8px; margin-bottom: 10px;">
                            ¡Código detectado con éxito! 🎉
                        </div>
                        <div style="font-size: 18px; color: #212529;">${textoDecodificado}</div>
                    `;
                })
                .catch(err => {
                    document.getElementById('resultado').innerHTML = `
                        <span style="color: #721c24;">No se encontró ningún código claro. ❌</span>
                        <br><small style="color: #666;">Intenta tomar la foto más de cerca, derecha y con buena luz.</small>
                    `;
                });
        });
    </script>

</body>
</html>
