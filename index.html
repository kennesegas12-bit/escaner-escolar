<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Mi Escáner Escolar Pro</title>
    <!-- Cargamos la librería desde un servidor de respaldo ultra compatible -->
    <script src="https://jsdelivr.net"></script>
    <style>
        body {
            font-family: 'Segoe UI', system-ui, sans-serif;
            text-align: center;
            background-color: #f0f2f5;
            padding: 20px;
            margin: 0;
        }
        .container {
            max-width: 400px;
            margin: 20px auto;
            background: white;
            padding: 25px;
            border-radius: 20px;
            box-shadow: 0 10px 25px rgba(0,0,0,0.05);
        }
        h1 { color: #1a1a1a; font-size: 26px; margin-bottom: 5px; }
        p { color: #666; font-size: 14px; margin-bottom: 20px; }
        
        /* Botones grandes y fáciles de presionar en el celular */
        .btn-principal {
            background-color: #1a73e8;
            color: white;
            border: none;
            padding: 15px 20px;
            border-radius: 12px;
            font-size: 16px;
            font-weight: 600;
            margin: 10px auto;
            cursor: pointer;
            display: block;
            width: 100%;
            box-shadow: 0 4px 6px rgba(26,115,232,0.2);
        }
        .btn-principal:active { background-color: #1557b0; }
        
        #reader {
            width: 100%;
            border-radius: 12px;
            overflow: hidden;
            background: #fafafa;
            display: none; /* Se oculta hasta que el usuario presione iniciar */
            margin-top: 15px;
        }
        
        #resultado {
            margin-top: 20px;
            padding: 15px;
            background-color: #e8f0fe;
            color: #1a73e8;
            border-radius: 12px;
            font-weight: bold;
            word-break: break-all;
            font-size: 16px;
        }
    </style>
</head>
<body>

    <div class="container">
        <h1>📸 Escáner Escolar Pro</h1>
        <p>Toca el botón azul para activar el escáner en tu teléfono</p>
        
        <!-- Botón manual visible para el usuario -->
        <button class="btn-principal" id="btnIniciar" onclick="encenderCamara()">📷 Encender Cámara</button>
        
        <!-- Aquí se mostrará la cámara cuando el usuario presione el botón -->
        <div id="reader"></div>
        
        <div id="resultado">Esperando acción...</div>
    </div>

    <script>
        let html5QrcodeScanner = null;

        function alEscanearExitoso(textoDecodificado) {
            // Detener el escáner para ahorrar batería una vez detectado
            if (html5QrcodeScanner) {
                html5QrcodeScanner.clear();
                document.getElementById('reader').style.display = 'none';
                document.getElementById('btnIniciar').style.display = 'block';
            }
            
            document.getElementById('resultado').innerHTML = `
                <div style="color: #0f5132; background-color: #d1e7dd; padding: 10px; border-radius: 8px; margin-bottom: 10px;">
                    ¡Código detectado con éxito! 🎉
                </div>
                <div style="font-size: 18px; color: #212529; word-break: break-all;">${textoDecodificado}</div>
            `;
        }

        function encenderCamara() {
            // Mostrar el contenedor de la cámara
            document.getElementById('reader').style.display = 'block';
            document.getElementById('btnIniciar').style.display = 'none';
            document.getElementById('resultado').innerText = "Iniciando cámara trasera...";

            // Configurar el escáner forzando el uso de la cámara trasera del celular
            const html5QrCode = new Html5Qrcode("reader");
            html5QrcodeScanner = html5QrCode;

            html5QrCode.start(
                { facingMode: "environment" }, // "environment" obliga a usar la cámara trasera
                {
                    fps: 10,
                    qrbox: { width: 250, height: 250 }
                },
                alEscanearExitoso
            )
            .then(() => {
                document.getElementById('resultado').innerText = "Apunta al código QR o de barras";
            })
            .catch((err) => {
                document.getElementById('resultado').innerHTML = `
                    <span style="color: red;">Error al abrir cámara: ${err}</span>
                    <br><br>
                    <p>Asegúrate de haber dado permisos de cámara a tu navegador.</p>
                `;
                document.getElementById('btnIniciar').style.style.display = 'block';
            });
        }
    </script>

</body>
</html>
