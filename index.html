<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Mi Escáner Escolar Pro</title>
    <!-- Cargamos la librería oficial desde su servidor principal -->
    <script src="https://unpkg.com" type="text/javascript"></script>
    <style>
        body {
            font-family: system-ui, -apple-system, sans-serif;
            text-align: center;
            background-color: #f0f2f5;
            padding: 20px;
            margin: 0;
        }
        .container {
            max-width: 400px;
            margin: 20px auto;
            background: white;
            padding: 25px;
            border-radius: 20px;
            box-shadow: 0 10px 25px rgba(0,0,0,0.05);
        }
        h1 { color: #1a1a1a; font-size: 26px; }
        p { color: #666; font-size: 14px; }
        #reader {
            width: 100%;
            border-radius: 12px;
            overflow: hidden;
            background: #fafafa;
        }
        #resultado {
            margin-top: 20px;
            padding: 15px;
            background-color: #e8f0fe;
            color: #1a73e8;
            border-radius: 12px;
            font-weight: bold;
            word-break: break-all;
            font-size: 16px;
        }
        /* Estilizamos los botones nativos que genera la librería automáticamente */
        #reader button {
            background-color: #1a73e8 !important;
            color: white !important;
            border: none !important;
            padding: 12px 20px !important;
            border-radius: 8px !important;
            font-size: 15px !important;
            font-weight: 600 !important;
            margin: 10px auto !important;
            cursor: pointer !important;
            display: inline-block !important;
            box-shadow: 0 4px 6px rgba(26,115,232,0.2);
        }
        #reader select {
            padding: 10px !important;
            border-radius: 8px !important;
            border: 1px solid #ccc !important;
            margin: 10px auto !important;
            width: 90% !important;
        }
    </style>
</head>
<body>

    <div class="container">
        <h1>📸 Escáner Escolar Pro</h1>
        <p>Usa el botón de abajo para activar la cámara o escanear un archivo</p>
        
        <!-- El lector se genera de forma automática e inmediata aquí -->
        <div id="reader"></div>
        
        <div id="resultado">Esperando código...</div>
    </div>

    <script>
        // Función que se activa cuando detecta un código QR o de barras
        function alEscanearExitoso(textoDecodificado) {
            document.getElementById('resultado').innerHTML = `
                <div style="color: #0f5132; background-color: #d1e7dd; padding: 10px; border-radius: 8px; margin-bottom: 10px;">
                    ¡Código detectado! 🎉
                </div>
                <div style="font-size: 18px; color: #212529;">${textoDecodificado}</div>
            `;
        }

        // Inicialización automática y directa recomendada por la librería
        const html5QrcodeScanner = new Html5QrcodeScanner(
            "reader", 
            { 
                fps: 10, 
                qrbox: { width: 250, height: 250 },
                rememberLastUsedCamera: true
            },
            /* verbose= */ false
        );
        
        html5QrcodeScanner.render(alEscanearExitoso);
    </script>

</body>
</html>
