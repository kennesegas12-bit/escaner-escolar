<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Mi Escáner Escolar Pro</title>
    <!-- Cargamos la versión super estable -->
    <script src="https://unpkg.com"></script>
    <style>
        body {
            font-family: 'Segoe UI', sans-serif;
            text-align: center;
            background-color: #f0f2f5;
            padding: 20px;
        }
        .container {
            max-width: 400px;
            margin: 0 auto;
            background: white;
            padding: 20px;
            border-radius: 15px;
            box-shadow: 0 4px 6px rgba(0,0,0,0.1);
        }
        h1 { color: #333; }
        #reader {
            width: 100%;
            border-radius: 10px;
            overflow: hidden;
            background: #e0e0e0;
        }
        #resultado {
            margin-top: 20px;
            padding: 15px;
            background-color: #e3f2fd;
            color: #0d47a1;
            border-radius: 10px;
            font-weight: bold;
            word-break: break-all;
        }
        /* Estilos para que los botones se vean geniales en el celular */
        button, input[type="file"]::-webkit-file-upload-button {
            background-color: #007bff !important;
            color: white !important;
            border: none !important;
            padding: 12px 24px !important;
            border-radius: 8px !important;
            font-size: 16px !important;
            margin: 10px 0 !important;
            width: 90%;
            cursor: pointer;
        }
    </style>
</head>
<body>

    <div class="container">
        <h1>📸 Escáner Escolar Pro</h1>
        <p>Prueba con la cámara en vivo o sube una foto de un código</p>
        
        <!-- El lector inteligente -->
        <div id="reader"></div>
        
        <div id="resultado">Esperando código...</div>
    </div>

    <script>
        function alEscanearExitoso(textoDecodificado) {
            document.getElementById('resultado').innerHTML = `
                <p style="color: green; margin: 0;">¡Código detectado! 🎉</p>
                <p style="margin: 5px 0 0 0; font-size: 18px;">${textoDecodificado}</p>
            `;
        }

        // Configuración con soporte para subir fotos si falla la cámara en vivo
        let escanner = new Html5QrcodeScanner(
            "reader", 
            { 
                fps: 10, 
                qrbox: { width: 250, height: 250 },
                experimentalFeatures: {
                    useBarCodeDetectorIfSupported: false
                }
            }
        );
        
        escanner.render(alEscanearExitoso);
    </script>

</body>
</html>
