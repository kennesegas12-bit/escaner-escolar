<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Mi Escáner Escolar Pro</title>
    <!-- Servidor global alternativo y ultra-estable -->
    <script src="https://cloudflare.com"></script>
    <style>
        body {
            font-family: 'Segoe UI', system-ui, -apple-system, sans-serif;
            text-align: center;
            background-color: #f0f2f5;
            padding: 20px;
            margin: 0;
        }
        .container {
            max-width: 400px;
            margin: 20px auto;
            background: white;
            padding: 25px;
            border-radius: 20px;
            box-shadow: 0 10px 25px rgba(0,0,0,0.05);
        }
        h1 { color: #1a1a1a; font-size: 26px; margin-bottom: 5px; }
        p { color: #666; font-size: 14px; margin-top: 0; }
        #reader {
            width: 100%;
            border-radius: 12px;
            overflow: hidden;
            background: #fafafa;
            border: 2px dashed #ccc;
        }
        #resultado {
            margin-top: 20px;
            padding: 15px;
            background-color: #e8f0fe;
            color: #1a73e8;
            border-radius: 12px;
            font-weight: bold;
            word-break: break-all;
            font-size: 16px;
        }
        /* Forzamos estilos atractivos para los controles de la cámara */
        button {
            background-color: #1a73e8 !important;
            color: white !important;
            border: none !important;
            padding: 12px 20px !important;
            border-radius: 8px !important;
            font-size: 15px !important;
            font-weight: 600 !important;
            margin: 10px auto !important;
            cursor: pointer !important;
            display: block !important;
            width: 90% !important;
            box-shadow: 0 4px 6px rgba(26,115,232,0.2);
        }
        button:active { background-color: #1557b0 !important; }
        select {
            padding: 10px !important;
            border-radius: 8px !important;
            border: 1px solid #ccc !important;
            margin: 10px auto !important;
            width: 90% !important;
            display: block !important;
        }
    </style>
</head>
<body>

    <div class="container">
        <h1>📸 Escáner Escolar Pro</h1>
        <p>Permite el acceso a la cámara o sube una imagen de tu código</p>
        
        <div id="reader"></div>
        
        <div id="resultado">Esperando código...</div>
    </div>

    <script>
        function alEscanearExitoso(textoDecodificado) {
            // Genera una alerta sonora o vibración visual al detectar el código
            document.getElementById('resultado').innerHTML = `
                <div style="color: #0f5132; background-color: #d1e7dd; padding: 10px; border-radius: 8px; margin-bottom: 10px;">
                    ¡Código detectado con éxito! 🎉
                </div>
                <div style="font-size: 18px; color: #212529;">${textoDecodificado}</div>
            `;
        }

        // Inicializamos el lector asegurando compatibilidad móvil absoluta
        function iniciarEscaner() {
            let escanner = new Html5QrcodeScanner(
                "reader", 
                { 
                    fps: 15, 
                    qrbox: function(viewfinderWidth, viewfinderHeight) {
                        let minEdgePercentage = 0.70;
                        let minEdgeLength = Math.min(viewfinderWidth, viewfinderHeight);
                        let qrboxSize = Math.floor(minEdgeLength * minEdgePercentage);
                        return { width: qrboxSize, height: qrboxSize };
                    },
                    rememberLastUsedCamera: true
                }
            );
            escanner.render(alEscanearExitoso);
        }

        // Ejecutar inmediatamente al cargar la página
        window.addEventListener('DOMContentLoaded', iniciarEscaner);
    </script>

</body>
</html>
