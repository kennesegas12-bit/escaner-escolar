<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Mi Escáner Escolar Pro</title>
    <!-- Usamos una librería alternativa oficial muy ligera -->
    <script src="https://unpkg.com"></script>
    <style>
        body {
            font-family: system-ui, -apple-system, sans-serif;
            text-align: center;
            background-color: #f0f2f5;
            padding: 20px;
            margin: 0;
        }
        .container {
            max-width: 400px;
            margin: 20px auto;
            background: white;
            padding: 25px;
            border-radius: 20px;
            box-shadow: 0 10px 25px rgba(0,0,0,0.05);
        }
        h1 { color: #1a1a1a; font-size: 26px; }
        .btn-principal {
            background-color: #1a73e8;
            color: white;
            border: none;
            padding: 15px 20px;
            border-radius: 12px;
            font-size: 16px;
            font-weight: 600;
            width: 100%;
            cursor: pointer;
        }
        #reader {
            width: 100%;
            border-radius: 12px;
            overflow: hidden;
            margin-top: 15px;
        }
        #resultado {
            margin-top: 20px;
            padding: 15px;
            background-color: #e8f0fe;
            color: #1a73e8;
            border-radius: 12px;
            font-weight: bold;
            word-break: break-all;
        }
    </style>
</head>
<body>

    <div class="container">
        <h1>📸 Escáner Escolar Pro</h1>
        <p>Toca el botón para iniciar el escaneo</p>
        
        <button class="btn-principal" id="btnIniciar" onclick="encenderCamara()">📷 Encender Cámara</button>
        
        <div id="reader"></div>
        
        <div id="resultado">Esperando acción...</div>
    </div>

    <script>
        function alEscanearExitoso(textoDecodificado) {
            document.getElementById('resultado').innerHTML = `
                <div style="color: #0f5132; background-color: #d1e7dd; padding: 10px; border-radius: 8px;">
                    ¡Código detectado! 🎉
                </div>
                <p style="font-size: 18px; color: #212529;">${textoDecodificado}</p>
            `;
        }

        function encenderCamara() {
            document.getElementById('resultado').innerText = "Cargando cámara...";
            
            // Usamos el inicializador básico que es más compatible con navegadores móviles viejos y nuevos
            let html5QrcodeScanner = new Html5QrcodeScanner(
                "reader", 
                { fps: 10, qrbox: { width: 250, height: 250 } }
            );
            
            try {
                html5QrcodeScanner.render(alEscanearExitoso);
                document.getElementById('btnIniciar').style.display = 'none';
                document.getElementById('resultado').innerText = "Apunta a un código";
            } catch (error) {
                document.getElementById('resultado').innerText = "Error: " + error;
            }
        }
    </script>

</body>
</html>
